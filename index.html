<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUKATSU NEXT インターバルタイマー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #022c22; /* エメラルドダーク */
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }
        .font-num {
            font-family: 'Oswald', sans-serif;
        }
        /* 巨大フォント */
        .text-giant {
            font-size: 35vmin;
            line-height: 1;
            text-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .text-huge {
            font-size: 15vmin;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        /* 背景色トランジション */
        #timer-screen {
            transition: background-color 0.3s ease;
        }
        .bg-phase-setup { background-color: #022c22; } /* 準備中背景 (emerald-950) */
        .bg-phase-prep { background-color: #eab308; } /* 黄色 (準備) */
        .bg-phase-work { background-color: #059669; } /* エメラルド (トレーニング) */
        .bg-phase-rest { background-color: #ef4444; } /* 赤 (休憩) */
        .bg-phase-agility { background-color: #f97316; } /* オレンジ (アジリティ) */
        .bg-phase-done { background-color: #8b5cf6; } /* 紫 (終了) */

        /* 操作用透明レイヤー */
        .touch-area {
            position: absolute;
            width: 100%;
            height: 50%;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .touch-area:active {
            opacity: 0.1;
            background-color: #fff;
        }
        #touch-top { top: 0; }
        #touch-bottom { bottom: 0; }
    </style>
</head>
<body class="h-screen w-screen">

    <!-- 設定画面 -->
    <div id="setup-screen" class="absolute inset-0 bg-emerald-950 z-40 flex flex-col p-6 overflow-y-auto">
        <div class="max-w-md w-full mx-auto space-y-6 pb-20">
            
            <h1 class="text-3xl font-black text-center text-white mt-8 mb-6 tracking-wider leading-tight">
                BUKATSU NEXT<br>
                <span class="text-xl text-emerald-400">インターバルタイマー</span>
            </h1>
            
            <!-- プリセットロード -->
            <div class="flex gap-2">
                <button onclick="loadPreset('shuttle')" class="flex-1 bg-emerald-800 hover:bg-emerald-700 p-3 rounded-xl text-sm font-bold transition">シャトルラン</button>
                <button onclick="loadPreset('agility')" class="flex-1 bg-emerald-800 hover:bg-emerald-700 p-3 rounded-xl text-sm font-bold transition">アジリティ</button>
            </div>

            <!-- 時間設定 -->
            <div class="bg-emerald-900/80 p-5 rounded-2xl shadow-lg space-y-4 border border-emerald-800">
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-gray-200">準備時間 (秒)</label>
                    <input type="number" id="input-prep" value="5" class="w-24 bg-emerald-950 text-white text-xl text-center rounded-lg p-2 font-num border border-emerald-700/50">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-emerald-400">トレーニング時間 (秒)</label>
                    <input type="number" id="input-work" value="20" class="w-24 bg-emerald-950 text-white text-xl text-center rounded-lg p-2 font-num border border-emerald-700/50">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-red-400">休憩時間 (秒)</label>
                    <input type="number" id="input-rest" value="10" class="w-24 bg-emerald-950 text-white text-xl text-center rounded-lg p-2 font-num border border-emerald-700/50">
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-white">セット数</label>
                    <input type="number" id="input-sets" value="8" class="w-24 bg-emerald-950 text-white text-xl text-center rounded-lg p-2 font-num border border-emerald-700/50">
                </div>
            </div>

            <!-- アジリティ設定 -->
            <div class="bg-emerald-900/80 p-5 rounded-2xl shadow-lg space-y-4 border border-emerald-500/50">
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-emerald-400">アジリティ(ランダム指示)</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="input-agility" class="sr-only peer">
                        <div class="w-14 h-7 bg-emerald-950 border border-emerald-700/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>
                <p class="text-xs text-emerald-200/70">トレーニング中にランダムなタイミングで「右」「左」などの指示が出ます。</p>
            </div>

            <!-- 表示・音声設定 -->
            <div class="bg-emerald-900/80 p-5 rounded-2xl shadow-lg space-y-4 border border-emerald-800">
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-gray-200">音声読み上げ</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="input-voice" class="sr-only peer" checked>
                        <div class="w-14 h-7 bg-emerald-950 border border-emerald-700/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>
                <div class="flex justify-between items-center">
                    <label class="text-lg font-bold text-gray-200">コンマ秒表示</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="input-decimals" class="sr-only peer" checked>
                        <div class="w-14 h-7 bg-emerald-950 border border-emerald-700/50 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>
            </div>

            <button onclick="startTimer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-2xl py-5 rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.4)] transition transform hover:scale-105 active:scale-95">
                START LETS GO!!
            </button>
        </div>
    </div>

    <!-- タイマー実行画面 -->
    <div id="timer-screen" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-phase-setup">
        
        <!-- ヘッダー情報 -->
        <div class="absolute top-8 w-full flex justify-between items-center px-6 md:px-8 text-white/90 font-bold text-2xl md:text-4xl z-50 pointer-events-none">
            <!-- 終了（ホームへ戻る）ボタン -->
            <button onclick="resetTimer()" class="pointer-events-auto bg-black/40 hover:bg-black/60 p-4 rounded-full backdrop-blur-sm transition flex items-center justify-center shadow-lg transform active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-10 md:w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <div id="phase-text" class="tracking-widest flex-1 text-center text-4xl">準備</div>
            <div class="font-num tracking-wide text-3xl">SET: <span id="set-text">1/8</span></div>
        </div>

        <!-- メインタイム表示 -->
        <div id="time-display" class="font-num text-giant font-black tabular-nums z-20">00.0</div>

        <!-- アジリティ指示表示 -->
        <div id="agility-display" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-phase-agility z-30 pointer-events-none">
            <div id="agility-text" class="text-huge font-black tracking-widest text-white animate-pulse"></div>
        </div>

        <!-- 停止ステータス表示 -->
        <div id="status-display" class="hidden absolute inset-0 flex items-center justify-center bg-black/60 z-30 pointer-events-none backdrop-blur-sm">
            <div class="text-6xl md:text-8xl font-black tracking-widest text-white/80">PAUSED</div>
        </div>

        <!-- 見えない操作エリア -->
        <div id="touch-top" class="touch-area" onclick="togglePause()">
            <span class="absolute bottom-4 text-white/30 text-lg font-bold pointer-events-none">▲ タップで 停止 / 再開 ▲</span>
        </div>
        <div id="touch-bottom" class="touch-area" onclick="resetTimer()">
            <span class="absolute top-4 text-white/30 text-lg font-bold pointer-events-none">▼ タップで リセット ▼</span>
        </div>
    </div>

    <script>
        // 状態管理
        let timerState = {
            isRunning: false,
            isPaused: false,
            phase: 'setup', 
            currentSet: 1,
            timeLeft: 0,
            endTime: 0,
            config: { prep: 5, work: 20, rest: 10, sets: 8, agility: false, voice: true, decimals: true }
        };
        
        let animationFrameId;
        let wakeLock = null;
        let nextAgilityTime = 0;
        let isAgilityActive = false;
        let lastAnnouncedSecond = -1;

        const AGILITY_COMMANDS = ['右', '左', '前', '後ろ', 'ジャンプ', 'ダッシュ'];
        const AGILITY_VISUALS = ['右 ▶︎', '◀︎ 左', '▲ 前', '▼ 後ろ', 'JUMP', 'DASH'];

        // Web Audio API (効果音生成)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playBuzzer() {
            // バスケのブザー音（ビーーー！）
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const freqs = [300, 310, 450]; // 濁った音を作るための周波数の組み合わせ
            const duration = 1.0; // 1秒間
            
            freqs.forEach(freq => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime + duration - 0.1);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            });
        }
        function playTick() { playTone(1000, 'sine', 0.05, 0.3); } // 毎秒の短い音
        function playBeep() { playTone(800, 'sine', 0.15, 0.5); } // カウントダウン音
        function playHighBeep() { playTone(1200, 'sine', 0.3, 0.6); } // 再開音
        function playAgilityBeep() { playTone(2000, 'square', 0.1, 0.8); }

        // Web Speech API (音声読み上げ)
        function speak(text) {
            if (!timerState.config.voice) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 連続読み上げの詰まりを防止
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'ja-JP'; // 必ず日本語を指定
                ut.rate = 1.2;
                window.speechSynthesis.speak(ut);
            }
        }

        // スマホ制限突破用：ユーザー操作時に無音を再生してエンジンを起動
        function initAudio() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if ('speechSynthesis' in window) {
                const dummy = new SpeechSynthesisUtterance(' '); // 空白文字
                dummy.lang = 'ja-JP';
                dummy.volume = 0; // 無音
                window.speechSynthesis.speak(dummy);
            }
        }

        // Screen Wake Lock API (画面消灯防止)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        const screens = {
            setup: document.getElementById('setup-screen'),
            timer: document.getElementById('timer-screen')
        };
        const displays = {
            time: document.getElementById('time-display'),
            phase: document.getElementById('phase-text'),
            set: document.getElementById('set-text'),
            agility: document.getElementById('agility-display'),
            agilityText: document.getElementById('agility-text'),
            status: document.getElementById('status-display')
        };

        function setPhaseColor(phase) {
            screens.timer.className = `hidden absolute inset-0 z-30 flex flex-col items-center justify-center bg-phase-${phase}`;
            screens.timer.classList.remove('hidden');
        }

        function formatTime(ms) {
            if (ms <= 0) return timerState.config.decimals ? "0.0" : "0";
            const totalSeconds = ms / 1000;
            
            if (timerState.config.decimals) {
                if (totalSeconds >= 100) return Math.ceil(totalSeconds).toString();
                return totalSeconds.toFixed(1);
            } else {
                return Math.ceil(totalSeconds).toString();
            }
        }

        function updateUI() {
            displays.time.textContent = formatTime(timerState.timeLeft);
            displays.set.textContent = `${timerState.currentSet}/${timerState.config.sets}`;
            
            let phaseStr = "";
            switch(timerState.phase) {
                case 'prep': phaseStr = "準備"; break;
                case 'work': phaseStr = "トレーニング"; break;
                case 'rest': phaseStr = "休憩"; break;
                case 'done': phaseStr = "終了"; break;
            }
            displays.phase.textContent = phaseStr;
        }

        function startTimer() {
            initAudio(); // 【重要】タップイベント内で音声エンジンを初期化
            requestWakeLock();
            
            timerState.config.prep = parseInt(document.getElementById('input-prep').value) || 5;
            timerState.config.work = parseInt(document.getElementById('input-work').value) || 20;
            timerState.config.rest = parseInt(document.getElementById('input-rest').value) || 10;
            timerState.config.sets = parseInt(document.getElementById('input-sets').value) || 1;
            timerState.config.agility = document.getElementById('input-agility').checked;
            timerState.config.voice = document.getElementById('input-voice').checked;
            timerState.config.decimals = document.getElementById('input-decimals').checked;

            screens.setup.classList.add('hidden');
            screens.timer.classList.remove('hidden');
            
            timerState.currentSet = 1;
            switchPhase('prep');
            
            timerState.isRunning = true;
            timerState.isPaused = false;
            displays.status.classList.add('hidden');
            
            saveToLocal();
            loop();
        }

        function switchPhase(newPhase) {
            timerState.phase = newPhase;
            setPhaseColor(newPhase);
            lastAnnouncedSecond = -1;
            isAgilityActive = false;
            displays.agility.classList.add('hidden');

            let duration = 0;
            if (newPhase === 'prep') {
                duration = timerState.config.prep;
                speak("準備");
            } else if (newPhase === 'work') {
                duration = timerState.config.work;
                playBuzzer(); // 開始ブザー
                if(timerState.currentSet === timerState.config.sets) speak("ラストセット！");
                else speak("トレーニング開始");
                
                if (timerState.config.agility && duration > 5) scheduleNextAgility(duration);
            } else if (newPhase === 'rest') {
                duration = timerState.config.rest;
                playBuzzer(); // 休憩ブザー
                speak("休憩");
            } else if (newPhase === 'done') {
                playBuzzer(); // 終了ブザー
                speak("練習終了、お疲れ様でした");
                timerState.isRunning = false;
                releaseWakeLock();
                return;
            }

            timerState.timeLeft = duration * 1000;
            timerState.endTime = Date.now() + timerState.timeLeft;
            updateUI();
        }

        function scheduleNextAgility(remainingWorkSeconds) {
            if (remainingWorkSeconds < 4) return; 
            const triggerIn = (Math.random() * (Math.min(10, remainingWorkSeconds - 2)) + 3);
            nextAgilityTime = timerState.endTime - (triggerIn * 1000);
        }

        function triggerAgility() {
            isAgilityActive = true;
            const r = Math.floor(Math.random() * AGILITY_COMMANDS.length);
            const cmdText = AGILITY_COMMANDS[r];
            const visualText = AGILITY_VISUALS[r];
            
            playAgilityBeep();
            speak(cmdText);
            
            displays.agilityText.innerHTML = visualText;
            displays.agility.classList.remove('hidden');

            setTimeout(() => {
                displays.agility.classList.add('hidden');
                isAgilityActive = false;
                if (timerState.phase === 'work' && timerState.timeLeft > 4000 && !timerState.isPaused) {
                    scheduleNextAgility(timerState.timeLeft / 1000);
                }
            }, 1500);
        }

        function loop() {
            if (!timerState.isRunning) return;
            if (timerState.isPaused) {
                animationFrameId = requestAnimationFrame(loop);
                return;
            }

            const now = Date.now();
            timerState.timeLeft = timerState.endTime - now;

            // アジリティチェック
            if (timerState.phase === 'work' && timerState.config.agility && !isAgilityActive) {
                if (now >= nextAgilityTime && timerState.timeLeft > 2000) triggerAgility();
            }

            // 毎秒の処理とカウントダウン
            const currentSecond = Math.ceil(timerState.timeLeft / 1000);
            if (currentSecond !== lastAnnouncedSecond && currentSecond > 0) {
                lastAnnouncedSecond = currentSecond;
                
                playTick(); // 毎秒のチクタク音

                if (currentSecond <= 10) {
                    // 10秒前からは数字を音声読み上げ
                    speak(currentSecond.toString());
                    
                    if (currentSecond <= 5) {
                        // 5秒前からは目立つビープ音も鳴らす
                        playBeep();
                    }
                }
            }

            // フェーズ移行処理
            if (timerState.timeLeft <= 0) {
                if (timerState.phase === 'prep') switchPhase('work');
                else if (timerState.phase === 'work') {
                    if (timerState.currentSet >= timerState.config.sets) switchPhase('done');
                    else switchPhase('rest');
                } else if (timerState.phase === 'rest') {
                    timerState.currentSet++;
                    switchPhase('work');
                }
            } else {
                updateUI();
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        function togglePause() {
            if (!timerState.isRunning || timerState.phase === 'done') return;
            
            timerState.isPaused = !timerState.isPaused;
            if (timerState.isPaused) {
                displays.status.classList.remove('hidden');
                timerState.endTime = 0; 
                playBeep();
            } else {
                displays.status.classList.add('hidden');
                timerState.endTime = Date.now() + timerState.timeLeft;
                if (timerState.config.agility && timerState.phase === 'work') {
                    nextAgilityTime = timerState.endTime - ((timerState.endTime - nextAgilityTime)); 
                }
                playHighBeep();
            }
        }

        function resetTimer() {
            timerState.isRunning = false;
            cancelAnimationFrame(animationFrameId);
            releaseWakeLock();
            screens.timer.classList.add('hidden');
            screens.setup.classList.remove('hidden');
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function loadPreset(type) {
            if (type === 'shuttle') {
                document.getElementById('input-prep').value = 5;
                document.getElementById('input-work').value = 20;
                document.getElementById('input-rest').value = 10;
                document.getElementById('input-sets').value = 8;
                document.getElementById('input-agility').checked = false;
            } else if (type === 'agility') {
                document.getElementById('input-prep').value = 5;
                document.getElementById('input-work').value = 45;
                document.getElementById('input-rest').value = 15;
                document.getElementById('input-sets').value = 5;
                document.getElementById('input-agility').checked = true;
            }
        }

        function saveToLocal() {
            const config = {
                prep: document.getElementById('input-prep').value,
                work: document.getElementById('input-work').value,
                rest: document.getElementById('input-rest').value,
                sets: document.getElementById('input-sets').value,
                agility: document.getElementById('input-agility').checked,
                voice: document.getElementById('input-voice').checked,
                decimals: document.getElementById('input-decimals').checked
            };
            try { localStorage.setItem('hooptimer_config', JSON.stringify(config)); } catch(e){}
        }

        function loadFromLocal() {
            try {
                const saved = localStorage.getItem('hooptimer_config');
                if (saved) {
                    const config = JSON.parse(saved);
                    document.getElementById('input-prep').value = config.prep;
                    document.getElementById('input-work').value = config.work;
                    document.getElementById('input-rest').value = config.rest;
                    document.getElementById('input-sets').value = config.sets;
                    document.getElementById('input-agility').checked = config.agility;
                    if(config.voice !== undefined) document.getElementById('input-voice').checked = config.voice;
                    if(config.decimals !== undefined) document.getElementById('input-decimals').checked = config.decimals;
                }
            } catch(e){}
        }

        window.onload = () => loadFromLocal();
    </script>
</body>
</html>
